# ---------------------------------------------------------------------------
# Site configuration. Everything you normally need to change is in this file
# and in the _data/ folder (publications.yml, news.yml, services.yml).
# ---------------------------------------------------------------------------

# Identity (shown in the sidebar)
title: Syed Talal Wasim
position: Computer Vision PhD Student
affiliation: University of Bonn
affiliation_url: https://www.uni-bonn.de/   # optional, delete this line to show plain text
email: wasimtalal(atsign)gmail.com
avatar: assets/img/pic.jpg
sidebar_align: left        # "left" or "center" - alignment of the desktop sidebar

# Sidebar links. Order here = order on the page.
# icon must be one of: scholar, cv, github, linkedin, x, orcid, mail, globe
links:
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=uHySarAAAAAJ&hl=en
    icon: scholar
  - label: CV
    url: assets/files/CV_Wasim_SyedTalal.pdf
    icon: cv
  - label: GitHub
    url: https://github.com/TalalWasim
    icon: github
  - label: LinkedIn
    url: https://www.linkedin.com/in/wasimsyedtalal/
    icon: linkedin

# Publications: this name is shown in bold in author lists (a trailing * is fine).
highlight_author: Syed Talal Wasim

# News: how many items to show before the "Show all" button.
news_visible: 5

# Search engines and link previews
description: Homepage of Syed Talal Wasim, computer vision PhD student at the University of Bonn working on long-term multimodal video understanding.
keywords: computer vision, video understanding, action anticipation, multimodal learning
url: https://talalwasim.github.io
og_image: assets/img/pic.jpg

# Favicon: a monogram in the site typeface. Regenerate assets/img/favicon.* if you change it.
favicon: assets/img/favicon.svg
favicon_png: assets/img/favicon.png
apple_touch_icon: assets/img/apple-touch-icon.png

# Footer credit line ("Built with Jekyll"). Set to false to hide it.
show_credit: true

# Google Analytics 4 measurement ID (G-XXXXXXXXXX). Leave empty to disable.
google_analytics:

# ---------------------------------------------------------------------------
# Build settings (you should not need to touch these)
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
sass:
  style: compressed
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
